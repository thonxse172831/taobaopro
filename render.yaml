services:
  - type: web
    name: taobaopro
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: taobaopro
      - key: SEPAY_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
